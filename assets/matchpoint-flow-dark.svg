<svg xmlns="http://www.w3.org/2000/svg" width="830" height="250" viewBox="0 0 830 250" role="img" aria-label="MatchPoint flow: Match, Policy, Authorize, Post, Verify. Anything outside the approval limit goes to a person. Guarantees: rules before every write, one post per invoice, read-back check, tamper-evident log."><title>MatchPoint flow: Match, Policy, Authorize, Post, Verify. Anything outside the approval limit goes to a person. Guarantees: rules before every write, one post per invoice, read-back check, tamper-evident log.</title><rect x="0.5" y="8.5" width="149" height="65" rx="10" fill="#161B22" stroke="#30363D"/><text x="75.0" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="middle">Match</text><text x="75.0" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="middle">Invoice · PO · receipt</text><rect x="170.5" y="8.5" width="149" height="65" rx="10" fill="#161B22" stroke="#30363D"/><text x="245.0" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="middle">Policy</text><text x="245.0" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="middle">Inside approval limit?</text><line x1="153" y1="41.0" x2="162" y2="41.0" stroke="#6E7681" stroke-width="1.5"/><path d="M161,37.0 L167,41.0 L161,45.0" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="340.5" y="8.5" width="149" height="65" rx="10" fill="#161B22" stroke="#30363D"/><text x="415.0" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="middle">Authorize</text><text x="415.0" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="middle">Approval on record</text><line x1="323" y1="41.0" x2="332" y2="41.0" stroke="#6E7681" stroke-width="1.5"/><path d="M331,37.0 L337,41.0 L331,45.0" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="510.5" y="8.5" width="149" height="65" rx="10" fill="#161B22" stroke="#30363D"/><text x="585.0" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="middle">Post</text><text x="585.0" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198A1" text-anchor="middle">Write to ERP once</text><line x1="493" y1="41.0" x2="502" y2="41.0" stroke="#6E7681" stroke-width="1.5"/><path d="M501,37.0 L507,41.0 L501,45.0" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="680.5" y="8.5" width="149" height="65" rx="10" fill="#8DA2D6" stroke="#8DA2D6"/><text x="755.0" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0D1117" text-anchor="middle">Verify</text><text x="755.0" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0D1117" text-anchor="middle">Read back and confirm</text><line x1="663" y1="41.0" x2="672" y2="41.0" stroke="#6E7681" stroke-width="1.5"/><path d="M671,37.0 L677,41.0 L671,45.0" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M245.0,74 V132" stroke="#6E7681" stroke-width="1.5"